# Countersign's own gate. This repository eats its own cooking: the receipt
# you get from running `countersign verify` here is produced by the same
# engine it ships.

[scan]
# The engine's own source. The demo tree is excluded here on purpose: the
# demo exists to contain planted defects, and it is verified by its own
# config (demo/countersign.toml) with an expected-failure claim.
paths = ["countersign"]
ignore_dirs = [
  ".git", "node_modules", "__pycache__", ".venv", "venv", ".mypy_cache",
  ".pytest_cache", ".ruff_cache", "dist", "build", "target", ".next", ".nuxt",
  ".wrangler", ".cache", ".countersign", "coverage", ".tox", ".idea",
  ".vscode", "vendor",
]
extensions = [
  ".py", ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".go", ".rs", ".rb",
  ".java", ".kt", ".swift", ".php", ".cs", ".scala",
]
exempt_marker = "countersign: exempt"
exclude_tests = true

[claims]
file = "claims.toml"

[receipts]
dir = ".countersign"

[run]
timeout_s = 300
max_output_bytes = 20000
