# audited on 20260903
name: countersign
on:
  push:
    branches: [main]
  pull_request:
    # labeled and unlabeled so that adding the countersign-approved label
    # re-runs the gate and the approval takes effect.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# The gate job signs its receipt with GitHub Artifact Attestations (this
# repository is public), which needs the two write permissions.
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -t .
      - name: wheel builds
        run: python -m pip wheel . --no-deps -w dist -q && ls dist

  gate:
    name: countersign verify (the action, on this repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./
        with:
          config: countersign.toml
