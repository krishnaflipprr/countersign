# audited on 20260903
# What is true about this repository, each claim paired with the command
# that fails if the claim is false.

[[claim]]
id = "unit-tests-pass"
statement = "The full unit test suite passes"
command = "python3 -m unittest discover -s tests -t ."
expect = "exit 0"

[[claim]]
id = "cli-boots"
statement = "The CLI reports its version"
command = "python3 -m countersign --version"
expect = "exit 0"

[[claim]]
id = "self-scan-clean"
statement = "The engine's own source has no marker findings and uses exactly the four line exemptions its rule table needs"
command = "python3 -m countersign verify --json --no-claims --no-pack | python3 -c \"import json,sys; r=json.load(sys.stdin); sys.exit(0 if r['scan']['findings']==0 and r['scan']['exemptions']==4 else 1)\""
expect = "exit 0"

[[claim]]
id = "demo-gets-caught"
statement = "The demo tree, which contains planted defects, fails its own gate"
command = "python3 -m countersign verify --config demo/countersign.toml --no-pack"
expect = "nonzero exit"

[[claim]]
id = "register-tamper-detected"
statement = "A tampered register is detected by the chain check"
command = "python3 tests/tamper_check.py"
expect = "exit 0"

[[claim]]
id = "register-chain-intact"
statement = "This repository's own evidence register verifies end to end"
command = "python3 -m countersign check"
expect = "exit 0"

[[claim]]
id = "unknown-claim-keys-refused"
statement = "A claims file with a misspelled key is refused instead of silently passing"
command = "python3 -c \"from countersign.claims import parse_claims; parse_claims('[[claim]]\\nid = \\\"x\\\"\\nstatement = \\\"s\\\"\\ncommand = \\\"true\\\"\\nexpct = \\\"exit 0\\\"\\n')\""
expect = "nonzero exit"

[[claim]]
id = "no-op-command-is-weakening"
statement = "Swapping a real claim command for one that cannot fail is reported as a weakening"
command = "python3 -c \"from countersign.claims import parse_claims as p; from countersign.claimsdiff import diff_claims as d; c = d(p('[[claim]]\\nid = \\\"t\\\"\\nstatement = \\\"s\\\"\\ncommand = \\\"npm test\\\"\\n'), p('[[claim]]\\nid = \\\"t\\\"\\nstatement = \\\"s\\\"\\ncommand = \\\"true\\\"\\n')); raise SystemExit(0 if c and c[0].weakened else 1)\""
expect = "exit 0"

[[claim]]
id = "unknown-config-keys-refused"
statement = "A config with a misspelled key is refused, naming the key, instead of silently changing the policy"
command = "python3 -c \"from pathlib import Path; from countersign.config import Config; Config.from_bytes(b'[claims]\\nrequird = [\\\"x\\\"]\\n', root=Path('.'), config_path=Path('countersign.toml'))\""
expect = "output contains"
needle = "did you mean 'required'"

[[claim]]
id = "empty-scan-refused"
statement = "A scan scope that matches no file is refused instead of passing"
command = "python3 -c \"from pathlib import Path; from countersign.config import Config; Config.from_bytes(b'[scan]\\npaths = []\\n', root=Path('.'), config_path=Path('countersign.toml')).collect_files()\""
expect = "output contains"
needle = "a scan of nothing cannot pass"

[[claim]]
id = "policy-narrowing-is-weakening"
statement = "Narrowing the scan, dropping a required claim or turning off fail_on_weakened is reported as a weakening of the policy"
command = "python3 -c \"from pathlib import Path; from countersign.config import Config as C; from countersign.policydiff import diff_policy; b = C.from_bytes(b'[scan]\\npaths = [\\\"src\\\", \\\"lib\\\"]\\n[claims]\\nrequired = [\\\"tests-pass\\\"]\\n', root=Path('.'), config_path=Path('countersign.toml')); h = C.from_bytes(b'[scan]\\npaths = [\\\"src\\\"]\\n[claims]\\nrequired = []\\nfail_on_weakened = false\\n', root=Path('.'), config_path=Path('countersign.toml')); w = sorted(c.field for c in diff_policy(b, h) if c.weakened); raise SystemExit(0 if w == ['fail_on_weakened', 'paths', 'required_claims'] else 1)\""
expect = "exit 0"
