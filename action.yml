# audited on 20260903
name: "Countersign"
description: "Your agent signs. Countersign proves it. Deterministic verification of agent completion claims: marker scan plus falsifiable-claims gate, tamper-evident receipts."
branding:
  icon: "check-circle"
  color: "green"

inputs:
  config:
    description: "Path to countersign.toml"
    required: false
    default: "countersign.toml"
  fail-on:
    description: "fail makes the workflow fail when the run is not countersigned; warn records the verdict without failing"
    required: false
    default: "fail"
  receipts-dir:
    description: "The receipts directory to upload as an artifact. Must match [receipts] dir in the config."
    required: false
    default: ".countersign"
  claims-base:
    description: "Git revision to diff the claims file against. Empty means the pull request's base branch on pull_request events and no diff otherwise."
    required: false
    default: ""
  attest:
    description: "true signs the receipt JSON with GitHub Artifact Attestations (Sigstore). Free for public repositories on every plan; private repositories need GitHub Enterprise Cloud. The calling job must grant permissions id-token: write and attestations: write."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Verify
      id: countersign
      shell: bash
      # Countersign is standard library only, so it runs straight from the
      # action checkout: no pip install, no build backend fetched from PyPI,
      # nothing added to the workflow's environment.
      env:
        PYTHONPATH: ${{ github.action_path }}
        COUNTERSIGN_CONFIG: ${{ inputs.config }}
        COUNTERSIGN_FAIL_ON: ${{ inputs.fail-on }}
        COUNTERSIGN_CLAIMS_BASE: ${{ inputs.claims-base }}
        PR_BASE_REF: ${{ github.base_ref }}
      run: |
        base_args=()
        if [ -n "$COUNTERSIGN_CLAIMS_BASE" ]; then
          base_args=(--claims-base "$COUNTERSIGN_CLAIMS_BASE")
        elif [ -n "$PR_BASE_REF" ]; then
          git fetch --no-tags --depth=1 origin "$PR_BASE_REF" || true
          base_args=(--claims-base "origin/$PR_BASE_REF")
        fi
        set +e
        python -m countersign verify --config "$COUNTERSIGN_CONFIG" --no-color \
          --summary-file "$RUNNER_TEMP/countersign-summary.md" "${base_args[@]}"
        status=$?
        set -e
        if [ -f "$RUNNER_TEMP/countersign-summary.md" ]; then
          cat "$RUNNER_TEMP/countersign-summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$status" -ne 0 ] && [ "$COUNTERSIGN_FAIL_ON" != "warn" ]; then
          exit "$status"
        fi
        if [ "$status" -eq 1 ]; then
          echo "::warning::Countersign verdict: NOT COUNTERSIGNED (fail-on=warn, workflow continues)"
        elif [ "$status" -ne 0 ]; then
          echo "::warning::Countersign could not run, exit $status: see the step log (fail-on=warn, workflow continues)"
        fi

    - name: Attest the receipt
      if: inputs.attest == 'true'
      uses: actions/attest@v4
      with:
        subject-path: ${{ inputs.receipts-dir }}/receipts/*.json
        predicate-type: https://getcountersign.me/receipt/v1
        predicate: '{"tool": "countersign"}'

    - name: Upload receipts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: countersign-receipts
        path: ${{ inputs.receipts-dir }}
        # The receipts directory is dot-prefixed; upload-artifact skips
        # hidden paths unless told otherwise.
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 90
