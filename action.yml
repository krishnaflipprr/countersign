# audited on 20260903
name: "Countersign"
description: "Your agent says done. Countersign checks: a deterministic gate for agent completion claims, with receipts the agent cannot edit."
branding:
  icon: "check-circle"
  color: "green"

inputs:
  config:
    description: "Path to countersign.toml"
    required: false
    default: "countersign.toml"
  fail-on:
    description: "fail makes the workflow fail when the run is not countersigned; warn records the verdict without failing"
    required: false
    default: "fail"
  receipts-dir:
    description: "The receipts directory to upload as an artifact. Must match [receipts] dir in the config."
    required: false
    default: ".countersign"
  claims-base:
    description: "Git revision whose policy and claims the run is judged against. Empty means the pull request's exact base commit on pull_request events and no base otherwise."
    required: false
    default: ""
  approval-label:
    description: "The pull request label a maintainer adds to approve a weakening of the policy or the claims. Only people with write access can add labels."
    required: false
    default: "countersign-approved"
  attest:
    description: "Sign the receipt JSON with GitHub Artifact Attestations (Sigstore). auto signs public repositories, where it is free on every plan, and skips private ones, which need GitHub Enterprise Cloud; true always signs and fails visibly when it cannot; false never signs. The calling job must grant id-token: write and attestations: write."
    required: false
    default: "auto"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"

    - name: Verify
      id: countersign
      shell: bash
      # Countersign is standard library only, so it runs straight from the
      # action checkout: no pip install, no build backend fetched from PyPI,
      # nothing added to the workflow's environment.
      env:
        PYTHONPATH: ${{ github.action_path }}
        COUNTERSIGN_CONFIG: ${{ inputs.config }}
        COUNTERSIGN_FAIL_ON: ${{ inputs.fail-on }}
        COUNTERSIGN_CLAIMS_BASE: ${{ inputs.claims-base }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # true when a maintainer added the approval label. Labels can only be
        # added by people with write access, so this is the maintainer's word.
        COUNTERSIGN_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, inputs.approval-label) }}
      run: |
        base_args=()
        if [ -n "$COUNTERSIGN_CLAIMS_BASE" ]; then
          base_args=(--base "$COUNTERSIGN_CLAIMS_BASE")
        elif [ -n "$PR_BASE_SHA" ]; then
          # The exact commit the pull request targets, not a branch name that
          # could move between the event and this step.
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          base_args=(--base "$PR_BASE_SHA")
        fi
        if [ "$COUNTERSIGN_APPROVED" = "true" ]; then
          base_args+=(--approved)
        fi
        set +e
        python -m countersign verify --config "$COUNTERSIGN_CONFIG" --no-color \
          --summary-file "$RUNNER_TEMP/countersign-summary.md" "${base_args[@]}"
        status=$?
        set -e
        if [ -f "$RUNNER_TEMP/countersign-summary.md" ]; then
          cat "$RUNNER_TEMP/countersign-summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$status" -ne 0 ] && [ "$COUNTERSIGN_FAIL_ON" != "warn" ]; then
          exit "$status"
        fi
        if [ "$status" -eq 1 ]; then
          echo "::warning::Countersign verdict: NOT COUNTERSIGNED (fail-on=warn, workflow continues)"
        elif [ "$status" -ne 0 ]; then
          echo "::warning::Countersign could not run, exit $status: see the step log (fail-on=warn, workflow continues)"
        fi

    - name: Attest the receipt
      if: inputs.attest == 'true' || (inputs.attest == 'auto' && github.event.repository.private == false)
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      with:
        subject-path: ${{ inputs.receipts-dir }}/receipts/*.json
        predicate-type: https://getcountersign.me/receipt/v1
        predicate: '{"tool": "countersign"}'

    - name: Upload receipts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: countersign-receipts
        path: ${{ inputs.receipts-dir }}
        # The receipts directory is dot-prefixed; upload-artifact skips
        # hidden paths unless told otherwise.
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 90
